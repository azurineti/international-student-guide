<style>
:root{--bg:#F4F7FB;--surface:#fff;--surface2:#EDF2F8;--ink:#0F2338;--muted:#586A80;--line:#D9E2EE;--navy:#16324F;--blue:#2A5C8F;--blue2:#3A78B5;--sky:#E6EFF8;--sand:#E9D5B5;--ok:#1E8E5A;--okbg:#E2F4EB;--warn:#A0610A;--warnbg:#FFF2D9;--bad:#BD3A2B;--badbg:#FCE6E3;--sh:0 1px 2px rgba(15,35,56,.05),0 14px 34px -14px rgba(15,35,56,.22);--hdr:rgba(255,255,255,.82);

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1725;--surface:#112135;--surface2:#16293F;--ink:#E8EFF8;--muted:#95A8BE;--line:#22374F;--blue:#6FA6DE;--blue2:#8DBBEB;--sky:#16293F;--okbg:#0F2E22;--warnbg:#33260D;--badbg:#38181A;--ok:#4BC58A;--warn:#E8AE55;--bad:#F07A6C;--sh:0 1px 2px rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.6);--hdr:rgba(11,23,37,.82)}}
:root[data-theme="dark"]{--bg:#0B1725;--surface:#112135;--surface2:#16293F;--ink:#E8EFF8;--muted:#95A8BE;--line:#22374F;--blue:#6FA6DE;--blue2:#8DBBEB;--sky:#16293F;--okbg:#0F2E22;--warnbg:#33260D;--badbg:#38181A;--ok:#4BC58A;--warn:#E8AE55;--bad:#F07A6C;--sh:0 1px 2px rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.6);--hdr:rgba(11,23,37,.82)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);scroll-behavior:smooth;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter","Noto Sans SC",system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang="zh"] body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Inter",system-ui,sans-serif}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;letter-spacing:-.02em}
h1{font-size:clamp(2rem,4.6vw,3.3rem);font-weight:800}h2{font-size:clamp(1.4rem,2.6vw,1.9rem);font-weight:750}h3{font-size:1.1rem;font-weight:700}

:focus-visible{outline:3px solid var(--blue2);outline-offset:2px;border-radius:8px}

.sp{flex:1}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:.2s}.ibtn:hover{transform:translateY(-1px);border-color:var(--blue2)}
.lang>button{width:auto;padding:0 12px;gap:6px;display:inline-flex;align-items:center;font:600 .85rem inherit;font-family:inherit}
.dd{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:6px;display:none;z-index:150}

.menu a:hover,.menu button:hover{background:var(--surface2);text-decoration:none}.menu .cur{color:var(--blue);font-weight:700}
.burger{display:none}
#drawer{position:fixed;inset:0;background:var(--bg);z-index:140;padding:calc(env(safe-area-inset-top,0px) + 76px) 20px 30px;overflow:auto;display:none}

@media(max-width:1040px){nav.main,.more{display:none}.burger{display:grid}}
@media(max-width:520px){.brand small{display:none}}
/* hero */
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#0F2640 0%,#16324F 45%,#2A5C8F 100%);padding:64px 0 74px}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at 30% 40%,#000 0,transparent 70%);-webkit-mask-image:radial-gradient(circle at 30% 40%,#000 0,transparent 70%)}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:float 14s ease-in-out infinite}
.b1{width:380px;height:380px;background:#3A78B5;top:-120px;right:-60px}.b2{width:300px;height:300px;background:#E9D5B5;opacity:.22;bottom:-120px;left:8%;animation-delay:-5s}.b3{width:240px;height:240px;background:#6FA6DE;top:30%;left:46%;animation-delay:-9s;opacity:.3}

.hero h1{color:#fff;margin-bottom:.4em}

.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0 30px}
.stats{display:flex;gap:28px;flex-wrap:wrap}.stats b{display:block;font-size:2rem;font-weight:800;letter-spacing:-.03em}.stats span{font-size:.82rem;color:#BBD0E7}
.hero-visual{position:relative}
.hero-visual .ph{border-radius:28px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.25)}
.fl{position:absolute;background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:16px;box-shadow:var(--sh);font-size:.85rem;font-weight:650;display:flex;gap:8px;align-items:center;animation:bob 6s ease-in-out infinite}
.fl .ic{color:var(--blue)}.fl.f1{left:-18px;top:16%}.fl.f2{right:-12px;top:44%;animation-delay:-2s}.fl.f3{left:10%;bottom:-16px;animation-delay:-4s}
@media(max-width:900px){.hero-in{grid-template-columns:1fr}.hero{padding:44px 0 56px}.fl.f1{left:6px}.fl.f2{right:6px}}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:14px;font:650 .95rem inherit;font-family:inherit;border:1px solid transparent;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s;text-decoration:none!important}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 10px 22px -10px var(--blue)}.btn.primary:hover{box-shadow:0 14px 26px -10px var(--blue)}
.hero .btn.primary{background:#fff;color:var(--navy)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ghost-w{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.btn.lg{padding:14px 24px;font-size:1rem}.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:11px}
/* cards */
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}

@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--sh);transition:transform .25s,border-color .25s}
a.card,.card.hov{color:var(--ink)}a.card:hover,.card.hov:hover{transform:translateY(-4px);border-color:var(--blue2);text-decoration:none}
.tile .ti{width:48px;height:48px;border-radius:15px;background:var(--sky);color:var(--blue);display:grid;place-items:center;margin-bottom:14px;font-size:1.3rem;transition:.3s}

.sech{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}.sech p{color:var(--muted);margin:0}
.kicker{font-size:.78rem;font-weight:750;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);margin-bottom:6px}
/* page head */
.phead{background:linear-gradient(180deg,var(--sky),transparent);padding:34px 0 18px;border-bottom:1px solid var(--line);margin-bottom:10px}
.ph-row{display:flex;gap:18px;align-items:flex-start}
.ph-ic{width:60px;height:60px;border-radius:19px;background:linear-gradient(135deg,var(--navy),var(--blue2));color:#fff;display:grid;place-items:center;font-size:1.6rem;flex:none;box-shadow:0 12px 24px -12px var(--blue)}
.phead h1{font-size:clamp(1.7rem,3.4vw,2.5rem);margin-bottom:.2em}.phead .lead{color:var(--muted);max-width:760px;margin:0}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center;font-size:.82rem;color:var(--muted)}

.badge.draft{background:var(--warnbg);color:var(--warn)}.badge.ok{background:var(--okbg);color:var(--ok)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.info{background:var(--sky);color:var(--blue)}
.note{display:flex;gap:12px;padding:14px 16px;border-radius:16px;font-size:.92rem;margin:0 0 18px;align-items:flex-start}

.ph{position:relative;margin:0;border-radius:20px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.empty{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;text-align:center;padding:18px;color:var(--muted);font-size:.85rem;background:repeating-linear-gradient(135deg,var(--surface2) 0 12px,var(--surface) 12px 24px);border-style:dashed}
.ph.empty .ic{font-size:1.6rem;color:var(--blue)}
.hero .ph.empty{background:repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 12px,rgba(255,255,255,.03) 12px 24px);color:#D5E3F3;border-color:rgba(255,255,255,.35)}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:5px;background:var(--surface2);border-radius:16px;margin-bottom:22px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:9px 16px;border-radius:12px;font:600 .9rem inherit;font-family:inherit;color:var(--muted);cursor:pointer;white-space:nowrap;transition:.2s}
.tabs button.on{background:var(--surface);color:var(--blue);box-shadow:var(--sh)}
.panel{display:none}.panel.on{display:block;animation:rise .4s ease}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.93rem}th,td{padding:12px 15px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface2);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--sky)}
/* accordion */
.acc{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden;transition:border-color .2s}
.acc[open]{border-color:var(--blue2);box-shadow:var(--sh)}
.acc summary{list-style:none;cursor:pointer;padding:16px 20px;font-weight:650;display:flex;gap:12px;align-items:center}.acc summary::-webkit-details-marker{display:none}
.acc summary .ci{margin-left:auto;transition:transform .25s;color:var(--muted)}.acc[open] summary .ci{transform:rotate(180deg)}
.acc summary .ai{width:38px;height:38px;border-radius:12px;background:var(--sky);color:var(--blue);display:grid;place-items:center;flex:none}
.acc .ab{padding:0 20px 20px;animation:rise .3s ease}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.steps div{background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:.92rem}.steps b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);margin-bottom:3px}
/* checklist */
.fw{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}
@media(max-width:900px){.fw{grid-template-columns:1fr}}
.ring{position:sticky;top:90px;text-align:center}
.ring svg{display:block;margin:0 auto;width:190px;height:190px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:14;stroke-linecap:round}
.ring .bg{stroke:var(--surface2)}.ring .fg{stroke:var(--blue);stroke-dasharray:502;stroke-dashoffset:502;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring .num{margin-top:-190px;height:190px;display:flex;flex-direction:column;justify-content:center;font-size:2.3rem;font-weight:800;letter-spacing:-.03em}.ring .num small{font-size:.8rem;color:var(--muted);font-weight:500}
.ck{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;cursor:pointer;transition:.25s;text-align:left;width:100%;font-family:inherit;color:var(--ink)}
.ck:hover{border-color:var(--blue2);transform:translateX(3px)}
.ck .bx{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;transition:.25s;margin-top:2px}
.ck.done{background:var(--okbg);border-color:transparent}.ck.done .bx{background:var(--ok);border-color:var(--ok);color:#fff;transform:scale(1.08)}.ck.done .tt{text-decoration:line-through;opacity:.65}
.ck .tt{font-weight:650;display:block}.ck .ds{font-size:.9rem;color:var(--muted);display:block;margin-top:2px}
.ck .lk{margin-top:6px;display:inline-flex;font-size:.85rem;font-weight:650;color:var(--blue)}
/* timeline */
.tl{position:relative;padding-left:30px}.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:3px;background:var(--line);border-radius:3px}
.tl .fillb{position:absolute;left:9px;top:6px;width:3px;background:var(--blue);border-radius:3px;height:0;transition:height 1.4s ease}
.ti2{position:relative;padding:0 0 22px}.ti2::before{content:"";position:absolute;left:-29px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--surface);border:3px solid var(--blue)}
.ti2 .d{font-size:.8rem;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.05em}.ti2 .t{font-weight:650}.ti2 .s{color:var(--muted);font-size:.9rem}
.cal{display:grid;gap:8px}.ce{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:center;padding:12px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c,var(--blue))}
.ce .dt{font-weight:700;font-size:.9rem}.ce .nm{font-size:.93rem}
@media(max-width:560px){.ce{grid-template-columns:1fr;gap:2px}}
.lg2{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:0 0 14px}.lg2 i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
/* forms */
label.f{display:block;font-size:.82rem;font-weight:650;color:var(--muted);margin-bottom:5px}
input[type=number],select,input[type=search],input[type=text]{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 1rem inherit;font-family:inherit}
input:focus,select:focus{outline:3px solid var(--sky);border-color:var(--blue2)}
.gr{display:grid;grid-template-columns:1fr 1fr 40px;gap:10px;margin-bottom:10px;align-items:end}
.res{margin-top:16px;padding:18px;border-radius:18px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}
.res big{display:block;font-size:2.6rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}.res span{color:#CFE0F3;font-size:.9rem}
/* bars */
.bar{display:flex;height:46px;border-radius:14px;overflow:hidden;margin:14px 0 8px;background:var(--surface2)}
.bar i{display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700;font-size:.85rem;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar i:nth-child(1){background:#16324F}.bar i:nth-child(2){background:#2A5C8F}.bar i:nth-child(3){background:#3A78B5}.bar i:nth-child(4){background:#6FA6DE}

/* do/dont */
.dd2{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:760px){.dd2{grid-template-columns:1fr}}
.lst{list-style:none;padding:0;margin:0;display:grid;gap:9px}.lst li{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:14px;background:var(--surface2);font-size:.94rem}
.lst.y li .ic{color:var(--ok)}.lst.n li .ic{color:var(--bad)}.lst .ic{margin-top:4px}

.sc{display:flex;flex-direction:column;gap:14px}
.sc .sit{font-weight:600}.sc .gb{display:flex;gap:8px;flex-wrap:wrap}
.gb button{flex:1;min-width:88px;padding:9px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:650 .85rem inherit;font-family:inherit;cursor:pointer;color:var(--ink);transition:.2s}

.vd.no{background:var(--badbg)}.vd.yes{background:var(--okbg)}.vd.chk{background:var(--warnbg)}

/* Сценарии «Можно ли так делать?» */
var SCEN = [
 {v:'no',s:T('Я нашёл абзац в интернете, перевёл его на английский и вставил в эссе без ссылки.','Мен интернеттен үзінді тауып, оны ағылшын тіліне аударып, дереккөзін көрсетпей эссеме қойдым.','I found a paragraph online, translated it into English and put it in my essay without a source.','我在网上找到一段文字，翻译成英文后没有注明出处就放进了我的论文。','Men internetden bir bölek tapdym, ony iňlis diline terjime edip, çeşmesini görkezmezden eseime goýdum.'),
  a:T('Перевод чужого текста без указания источника — всё равно плагиат. Укажи автора и источник, а идеи пересказывай своими словами.','Біреудің мәтінін дереккөзін көрсетпей аудару да плагиат болып саналады. Автор мен дереккөзді көрсет, ал идеяларды өз сөзіңмен жаз.','Translating someone else’s text without citing the source is still plagiarism. Name the author and source, and put the ideas in your own words.','未注明出处而翻译他人的文字，仍然是抄袭。请标明作者和来源，并用自己的话转述观点。','Başga birinin tekstini çeşmesini görkezmezden terjime etmek hem plagiatdyr. Awtory we çeşmäni görkez, pikirleri öz sözleriň bilen aýt.')},
 {v:'chk',s:T('Я использую онлайн-переводчик, чтобы понять задание и незнакомые слова.','Тапсырманы және таныс емес сөздерді түсіну үшін онлайн-аудармашыны пайдаланамын.','I use an online translator to understand the task and unfamiliar words.','我用在线翻译来理解作业要求和生词。','Tabşyrygy we nätanyş sözleri düşünmek üçin onlaýn terjimeçi ulanýaryn.'),
  a:T('Понимать задание с помощью переводчика обычно нормально. Но сдавать машинный перевод как свою работу — нельзя, особенно если задание проверяет твой язык. Правила смотри в силлабусе или спроси преподавателя.','Тапсырманы түсіну үшін аудармашыны қолдану әдетте қалыпты жағдай. Бірақ машиналық аударманы өз жұмысың ретінде тапсыруға болмайды, әсіресе тапсырма сенің тіл білімінді тексеретін болса. Ережені силлабустан қара немесе оқытушыдан сұра.','Using a translator to understand the task is usually fine. Handing in machine translation as your own work is not — especially when the task tests your language. Check the syllabus or ask your teacher.','用翻译工具理解作业要求通常没问题，但把机器翻译当作自己的作业提交则不允许，尤其是当作业考查你的语言能力时。请查看课程大纲或询问教师。','Tabşyrygy düşünmek üçin terjimeçini ulanmak adatça mesele däl. Ýöne maşyn terjimesini öz işiň hökmünde tabşyrmak bolmaýar, esasanam tabşyryk seniň dil bilimiňi barlaýan bolsa. Düzgüni silabusdan gör ýa-da mugallymdan sora.')},
 {v:'chk',s:T('Я попросил ChatGPT (ИИ) написать часть моего задания.','Мен ChatGPT-тен (жасанды интеллект) тапсырмамның бір бөлігін жазып беруін сұрадым.','I asked ChatGPT (AI) to write part of my assignment.','我让ChatGPT（人工智能）帮我写了作业的一部分。','Men ChatGPT-den (emeli aň) tabşyrygymyň bir bölegini ýazyp bermegini haýyş etdim.'),
  a:T('Единого ответа нет: это зависит от правил университета и требований преподавателя. Выдавать чужой (в т.ч. машинный) текст за свой без разрешения нельзя. Спроси преподавателя ДО сдачи и посмотри раздел «Плагиат и списывание» на сайте.','Бір ғана жауап жоқ: бұл университет ережелері мен оқытушының талаптарына байланысты. Басқа біреудің (соның ішінде машинаның) мәтінін рұқсатсыз өз мәтініңдей көрсетуге болмайды. Тапсырар алдында оқытушыдан сұра және сайттағы «Плагиат және көшіру» бөлімін оқы.','There is no single answer: it depends on university rules and your teacher’s requirements. Presenting someone else’s (including machine-written) text as your own without permission is not allowed. Ask your teacher BEFORE you submit and read the “Plagiarism” page on the university site.','没有统一答案：这取决于大学规定和教师要求。未经许可，不得把他人（包括机器）写的文本当作自己的。提交前请先问教师，并阅读大学官网的“抄袭与作弊”页面。','Ýeke-täk jogap ýok: bu uniwersitetiň düzgünlerine we mugallymyň talaplaryna baglydyr. Başga birinin (şol sanda maşynyň) tekstini rugsatsyz öz tekstiň ýaly görkezmek bolmaýar. Tabşyrmazyndan ÖŇ mugallymdan sora we saýtdaky «Plagiat we göçürme» sahypasyny oka.')},
 {v:'no',s:T('Я дал другу переписать мою готовую домашнюю работу.','Мен досыма дайын үй жұмысымды көшіріп жазуға бердім.','I let a friend copy my finished homework.','我把写好的作业给朋友抄了。','Men dostuma taýýar öý işimi göçürmäge berdim.'),
  a:T('Объяснить тему — можно и даже приветствуется (взаимопомощь). Но дать готовую работу переписать — плохая идея: одинаковые работы могут считаться списыванием у обоих.','Тақырыпты түсіндіру — мүмкін және қолдау табады (өзара көмек). Ал дайын жұмысты көшіруге беру — жаман идея: бірдей жұмыстар екеуіне де көшіру болып саналуы мүмкін.','Explaining the topic is fine and even encouraged (mutual help). But letting someone copy your finished work is a bad idea: identical papers can count as cheating for both of you.','帮朋友讲解知识点是可以的，甚至值得鼓励（互帮互助）。但把写好的作业让人照抄不可取：两份雷同的作业可能对双方都被认定为作弊。','Temany düşündirmek mümkin we hatda goldanylýar (özara kömek). Ýöne taýýar işi göçürmäge bermek erbet pikir: birmeňzeş işler ikisi üçin hem göçürme hasaplanyp bilner.')},
 {v:'chk',s:T('Я использую в новом задании кусок своей прошлой работы.','Жаңа тапсырмада өзімнің бұрынғы жұмысымның бір бөлігін пайдаланамын.','I reuse a part of my own earlier paper in a new assignment.','我在新作业里用了自己以前作业的一部分。','Täze tabşyrykda öz öňki işimiň bir bölegini ulanýaryn.'),
  a:T('Это называют самоплагиатом. Заранее спроси преподавателя и укажи, что это твой предыдущий текст.','Мұны өзіндік плагиат деп атайды. Алдын ала оқытушыдан сұра және бұл өзіңнің бұрынғы мәтінің екенін көрсет.','This is called self-plagiarism. Ask your teacher in advance and state that it is your earlier text.','这叫“自我抄袭”。请事先询问教师，并注明这是你以前写的文字。','Muňa öz-özüňi göçürmek diýilýär. Öňünden mugallymdan sora we bu seniň öňki tekstiň diýip görkez.')},
 {v:'yes',s:T('Я взял предложение из статьи, поставил кавычки и указал автора, год и источник.','Мен мақаладан сөйлем алып, тырнақшаға салып, автор, жыл және дереккөзді көрсеттім.','I took a sentence from an article, put it in quotation marks and cited the author, year and source.','我从一篇文章中摘取了一句话，加上引号，并注明了作者、年份和出处。','Men makaladan bir sözlem aldym, dyrnak içine aldym we awtory, ýyly hem çeşmäni görkezdim.'),
  a:T('Да. Точная цитата в кавычках со ссылкой — правильный способ. Не злоупотребляй: основная часть работы должна быть твоей.','Иә. Тырнақшадағы нақты дәйексөз бен сілтеме — дұрыс тәсіл. Шектен шықпа: жұмыстың негізгі бөлігі сенікі болуы тиіс.','Yes. An exact quote in quotation marks with a citation is the right way. Do not overdo it: most of the work must be yours.','可以。带引号并附出处的原文引用是正确做法。但不要滥用：作业的主体内容必须是你自己的。','Hawa. Dyrnak içindäki takyk sitata we salgylanma — dogry usul. Aşa geçme: işiň esasy bölegi seniň özüňki bolmaly.')},
 {v:'yes',s:T('Я пересказал идею статьи своими словами и указал источник.','Мен мақаланың идеясын өз сөзіммен жеткізіп, дереккөзді көрсеттім.','I retold an article’s idea in my own words and cited the source.','我用自己的话转述了文章的观点，并注明了来源。','Men makalanyň pikirini öz sözlerim bilen aýtdym we çeşmäni görkezdim.'),
  a:T('Да. Это парафраз со ссылкой. Важно именно переписать мысль по-своему, а не заменить пару слов.','Иә. Бұл — сілтемесі бар парафраз. Бірнеше сөзді ауыстыру емес, ойды өзіңше қайта жазу маңызды.','Yes. That is a paraphrase with a citation. You must really rewrite the idea in your own way, not just swap a few words.','可以。这是带出处的改写。关键是真正用自己的方式重新表达，而不是只换几个词。','Hawa. Bu çeşmesi görkezilen parafraz. Birnäçe sözi çalyşmak däl, pikiri öz ýoluň bilen täzeden aýtmak möhümdir.')},
 {v:'no',s:T('На экзамене телефон лежит у меня в кармане, я его не трогаю.','Емтиханда телефоным қалтамда жатыр, оған тиіспеймін.','During the exam my phone is in my pocket, but I don’t touch it.','考试时手机放在我口袋里，但我不碰它。','Synagda telefonym jübümde ýatyr, oňa degmeýärin.'),

 {c:'study',q:T('Можно ли пропустить занятие, если я болею?','Ауырып қалсам, сабақты жіберуге бола ма?','Can I miss a class because I am sick?','生病了可以缺课吗？','Syrkawlasam, sapagy sypdyrsam bolarmy?'),
  a:T('Пропуск возможен по уважительным причинам: болезнь, подтверждённая справкой врача, и чрезвычайные обстоятельства. Сообщи преподавателю и посмотри правила посещаемости в силлабусе.','Дәлелді себептермен жіберуге болады: дәрігер анықтамасымен расталған ауру және төтенше жағдайлар. Оқытушыға хабарла және силлабустан қатысу ережелерін қара.','Absences are allowed for valid reasons: illness confirmed by a doctor’s note, and emergencies. Tell your teacher and check the attendance rules in the syllabus.','因正当理由可以缺课：有医生证明的疾病和突发情况。请告知教师，并在课程大纲中查看出勤规定。','Oňat sebäpler bilen sypdyrmak bolýar: lukman kepilnamasy bilen tassyklanan kesel we adatdan daşary ýagdaýlar. Mugallyma habar ber we silabusda gatnaşyk düzgünlerine seret.')},
 {c:'study',q:T('Сколько длится семестр?','Семестр қанша уақытқа созылады?','How long is a semester?','一个学期有多长？','Semestr näçe wagt dowam edýär?'),
  a:T('15 недель. Учебный год — 36 недель: 30 недель обучения и 6 недель аттестации. Экзаменационная сессия — от 1 до 3 недель.','15 апта. Оқу жылы — 36 апта: 30 апта оқу және 6 апта аттестация. Емтихан сессиясы — 1-ден 3 аптаға дейін.','15 weeks. The academic year is 36 weeks: 30 weeks of study and 6 of assessment. An exam session lasts 1–3 weeks.','15周。一个学年共36周：30周授课加6周考核。考试周持续1至3周。','15 hepde. Okuw ýyly 36 hepde: 30 hepde okuw we 6 hepde attestasiýa. Synag sessiýasy 1-den 3 hepdä çenli dowam edýär.')},
 {c:'study',q:T('Что будет, если я получу «F»?','«F» алсам не болады?','What happens if I get an “F”?','如果得了“F”会怎样？','«F» alsam näme bolar?'),
  a:T('Предмет нужно изучить повторно в летнем семестре — он платный.','Пәнді жазғы семестрде қайта оқу керек — ол ақылы.','You must retake the course in the summer semester, which is paid.','这门课需要在暑期学期重修，暑期学期是收费的。','Dersi tomusky semestrde gaýtadan öwrenmeli — ol tölegli.')},
 {c:'study',q:T('Как рассчитывается итоговая оценка?','Қорытынды баға қалай есептеледі?','How is my final grade calculated?','期末总评如何计算？','Jemleýji baha nähili hasaplanýar?'),
  a:T('Итоговая = (РК1 + РК2) / 2 × 0,6 + экзамен × 0,4. К экзамену допускают, если по каждому рубежному контролю не меньше 50 баллов. Попробуй калькулятор в разделе «Учёба».','Қорытынды баға = (МБ1 + МБ2) / 2 × 0,6 + емтихан × 0,4. Әр межелік бақылаудан кемінде 50 балл болса, емтиханға жіберіледі. «Оқу» бөліміндегі калькуляторды байқап көр.','Final = (RK1 + RK2) / 2 × 0.6 + exam × 0.4. You are admitted to the exam if you have at least 50 points in each midterm control. Try the calculator in the “Studies” section.','总评 =（阶段考核1 + 阶段考核2）/ 2 × 0.6 + 考试 × 0.4。每次阶段考核至少50分才能参加考试。可以试试“学习”栏目中的计算器。','Jemleýji baha = (AG1 + AG2) / 2 × 0,6 + synag × 0,4. Her aralyk gözegçilikden azyndan 50 bal bolsa, synaga rugsat berilýär. «Okuw» bölümindäki hasaplaýjyny synap gör.')},
 {c:'money',q:T('Когда нужно платить за обучение?','Оқу ақысын қашан төлеу керек?','When do I have to pay tuition?','学费什么时候缴？','Okuw tölegini haçan tölemeli?'),
  a:T('Либо полностью до 25 августа, либо по графику. Вариант I: 40% до 25 августа, 10% до 1 декабря, 25% до 1 февраля, 25% до 1 апреля. Вариант II: 50% до 25 августа, остаток до 1 апреля. Сверь с текущим годом.','Не толық 25 тамызға дейін, не кесте бойынша. I нұсқа: 25 тамызға дейін 40%, 1 желтоқсанға дейін 10%, 1 ақпанға дейін 25%, 1 сәуірге дейін 25%. II нұсқа: 25 тамызға дейін 50%, қалғаны 1 сәуірге дейін. Ағымдағы жылмен салыстырып тексер.','Either in full by 25 August, or in instalments. Option I: 40% by 25 Aug, 10% by 1 Dec, 25% by 1 Feb, 25% by 1 Apr. Option II: 50% by 25 Aug, the rest by 1 Apr. Confirm for the current year.','要么8月25日前一次缴清，要么分期缴纳。方案一：8月25日前40%，12月1日前10%，2月1日前25%，4月1日前25%。方案二：8月25日前50%，余额4月1日前缴清。请以当年规定为准。','Ýa-da 25 awgusta çenli doly, ýa-da tertip boýunça. I wariant: 25 awgusta çenli 40%, 1 dekabra çenli 10%, 1 fewrala çenli 25%, 1 aprele çenli 25%. II wariant: 25 awgusta çenli 50%, galany 1 aprele çenli. Häzirki ýyl bilen deňeşdirip barla.')},

  sec('<div class="note warn">'+ic('alert')+'<div>'+L(T('Фото из Путеводителя принадлежат университету — получи разрешение на использование или сделай свои снимки.','Нұсқаулықтағы фотолар университетке тиесілі — пайдалануға рұқсат ал немесе өз суреттеріңді түсір.','Photos from the Guide belong to the university — get permission or take your own.','《新生指南》中的照片归大学所有——请获得使用许可，或自行拍摄。','Gollanmadaky suratlar uniwersitete degişli — ulanmaga rugsat al ýa-da öz suratlaryňy düşür.'))+'</div></div><div class="tw"><table><thead><tr><th>'+L(T('Ключ','Кілт','Key','键名','Açar'))+'</th><th>'+L(T('Страница','Бет','Page','页面','Sahypa'))+'</th><th>'+L(T('Что снять','Нені түсіру керек','What to shoot','拍摄内容','Nämäni surata düşürmeli'))+'</th><th>'+L(T('Размер','Өлшемі','Size','尺寸','Ölçegi'))+'</th><th></th></tr></thead><tbody>'+PHOTO_SPEC.map(function(s){return '<tr><td><code>'+s[0]+'</code></td><td>'+L(NAV[s[1]])+'</td><td>'+L(s[2])+'</td><td>'+s[3]+'</td><td>'+(PHOTOS[s[0]]?'✅':'⬜')+'</td></tr>'}).join('')+'</tbody></table></div>');
};

/* =====================================================================
   ШАПКА / ПОДВАЛ / РОУТЕР

var ARIA = {search:T('Поиск','Іздеу','Search','搜索','Gözleg'),lang:T('Язык','Тіл','Language','语言','Dil'),theme:T('Тема','Тақырып','Theme','主题','Tema'),menu:T('Меню','Мәзір','Menu','菜单','Menýu'),skip:T('Перейти к содержимому','Мазмұнға өту','Skip to content','跳到正文','Mazmuna geç')};
function renderHeader(p){
  var nav=MAIN.map(function(k){return '<a href="'+href(k)+'" class="'+(k===p?'on':'')+'">'+L(NAV[k])+'</a>'}).join('');
  var more=MORE.map(function(k){return '<a href="'+href(k)+'">'+ic(ICON_OF[k])+' '+L(NAV[k])+'</a>'}).join('');
  var langs=LANGS.map(function(l){return '<button data-act="lang" data-l="'+l.c+'" class="'+(l.c===lang?'cur':'')+'">'+l.n+(l.c===lang?' '+ic('check'):'')+'</button>'}).join('');
  var cur=LANGS.filter(function(l){return l.c===lang})[0];
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  $('#hdr').innerHTML='<div class="container hbar"><a class="brand" href="'+href('home')+'"><span class="mk">'+ic('cap')+'</span><span>'+L(BRAND)+'<small>'+L(UNI)+'</small></span></a><nav class="main">'+nav+'<div class="dd more"><button data-act="menu" data-m="more">'+L(MORE_L)+' '+ic('down')+'</button><div class="menu" id="m-more">'+more+'</div></div></nav><span class="sp"></span>'+
  '<button class="ibtn" data-act="search" aria-label="'+esc(L(ARIA.search))+'">'+ic('search')+'</button>'+
  '<div class="dd lang"><button class="ibtn" data-act="menu" data-m="lang" aria-label="'+esc(L(ARIA.lang))+'">'+ic('globe')+' '+cur.s+'</button><div class="menu" id="m-lang">'+langs+'</div></div>'+
  '<button class="ibtn" data-act="theme" aria-label="'+esc(L(ARIA.theme))+'">'+ic(dark?'sun':'moon')+'</button>'+
  '<button class="ibtn burger" data-act="drawer" aria-label="'+esc(L(ARIA.menu))+'">'+ic('menu')+'</button></div>';
  $('#drawer').innerHTML=['home'].concat(MAIN,MORE).map(function(k){return '<a href="'+href(k)+'">'+ic(ICON_OF[k])+' '+L(NAV[k])+'</a>'}).join('');
}
function renderFooter(){
  $('#ftr').innerHTML='<div class="container"><div class="fg2"><div><b style="color:var(--ink)">'+L(BRAND)+'</b><p style="margin:8px 0 0">'+L(CREDIT)+'</p><p style="margin:8px 0 0;color:var(--ink);font-weight:550">'+authors().join(' · ')+'</p><p style="margin:8px 0 0">'+L(NOT_OFFICIAL)+'</p></div>'+
  '<div><h4>'+L(T('Разделы','Бөлімдер','Sections','栏目','Bölümler'))+'</h4><ul>'+MAIN.map(function(k){return '<li><a href="'+href(k)+'">'+L(NAV[k])+'</a></li>'}).join('')+'</ul></div>'+
  '<div><h4>'+L(MORE_L)+'</h4><ul>'+MORE.map(function(k){return '<li><a href="'+href(k)+'">'+L(NAV[k])+'</a></li>'}).join('')+'</ul></div></div></div>';
}
function parse(){
  var h=location.hash.replace(/^#\/?/,'').split('/'); var l=h[0];
  if(!LANGS.some(function(x){return x.c===l})){
    l=store.get('lang',null);
    if(!l||!LANGS.some(function(x){return x.c===l})){var n=(navigator.language||'ru').slice(0,2).toLowerCase(); l=LANGS.some(function(x){return x.c===n})?n:'ru';}
    return {l:l,p:'home',s:''};
  }
  var p=PAGES.indexOf(h[1])>-1?h[1]:'home';
  return {l:l,p:p,s:h[2]||''};
}
function render(){
  var r=parse(); lang=r.l; document.documentElement.lang=lang; store.set('lang',lang);
  fb=0; var html=V[r.p](r.s);
  var app=$('#app'); app.innerHTML=html; app.setAttribute('data-fb',fb);
  if(lastPage!==r.p){app.classList.remove('pg');void app.offsetWidth;app.classList.add('pg');window.scrollTo(0,0);}
  lastPage=r.p;
  renderHeader(r.p); renderFooter();
  document.title=(r.p==='home'?'':L(NAV[r.p])+' · ')+L(BRAND);
  var sk=$('.skip'); if(sk) sk.textContent=L(ARIA.skip);
  $('#sin').placeholder=L(T('Поиск по сайту…','Сайттан іздеу…','Search the site…','搜索本站…','Sahypadan gözle…'));
  $('#drawer').classList.remove('open');
  after(r.p);
}
function after(p){
  var io=(typeof IntersectionObserver==='function')?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);animate(e.target)}})},{threshold:.12}):null;
  $$('.rv,.tl,[data-bar],[data-count]').forEach(function(el){ if(io) io.observe(el); else {el.classList.add('in');animate(el)} });
  setTimeout(function(){$$('.rv').forEach(function(el){el.classList.add('in')})},2500);
  if(p==='first-week') paintFW();
  if(p==='study'){finCalc();gpaCalc();}
}
function animate(el){
  if(el.hasAttribute('data-count')){ if(el.done) return; el.done=1; var to=+el.getAttribute('data-count'),t0=null; (function step(ts){t0=t0||ts;var k=Math.min((ts-t0)/1100,1);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)})(0); }
  if(el.classList.contains('tl')){var f=$('.fillb',el);if(f)f.style.height='calc(100% - 12px)';}
  if(el.hasAttribute('data-bar')){var w=el.getAttribute('data-bar').split(',');$$('i',el).forEach(function(i,k){i.style.width=w[k]+'%'})}
}
function paintFW(){
  var done=store.get('fw',[]).filter(function(id){return FW.some(function(x){return x.id===id})});
  var n=done.length, tot=FW.length, fg=$('#ringfg'); if(!fg) return;
  fg.style.strokeDashoffset=n?502-502*n/tot:510; $('#ringn').textContent=n+'/'+tot;
  if(n===tot && !paintFW.cel){paintFW.cel=1;toast(L(T('🎉 Все шаги выполнены!','🎉 Барлық қадам орындалды!','🎉 All steps done!','🎉 全部完成！','🎉 Ähli ädimler ýerine ýetirildi!')))}
  if(n<tot) paintFW.cel=0;
}
function dec(x,n){var s=x.toFixed(n);return (lang==='en'||lang==='zh')?s:s.replace('.',',')}
function letterOf(x){var t=[[95,'A'],[90,'A-'],[85,'B+'],[80,'B'],[75,'B-'],[70,'C+'],[65,'C'],[60,'C-'],[55,'D+'],[50,'D'],[25,'FX'],[0,'F']];for(var i=0;i<t.length;i++){if(x>=t[i][0])return t[i][1]}return 'F'}
function finCalc(){
  var f1=$('#f1'); if(!f1) return;
  var v=function(id){var n=parseFloat($(id).value);return isNaN(n)?0:Math.max(0,Math.min(100,n))};
  var a=v('#f1'),b=v('#f2'),e=v('#f3'), io=((a+b)/2)*0.6+e*0.4, ok=a>=50&&b>=50;
  var okT=T('Допуск к экзамену есть (оба РК ≥ 50).','Емтиханға жіберіледі (екі МБ де ≥ 50).','You are admitted to the exam (both RK ≥ 50).','可以参加考试（两次阶段考核均≥50分）。','Synaga rugsat bar (iki AG hem ≥ 50).');
  var noT=T('⚠️ Нет допуска к экзамену: нужно минимум 50 баллов по каждому РК.','⚠️ Емтиханға жіберілмейді: әр МБ-дан кемінде 50 балл қажет.','⚠️ Not admitted to the exam: at least 50 points in each RK are required.','⚠️ 不能参加考试：每次阶段考核至少需要50分。','⚠️ Synaga rugsat ýok: her AG-den azyndan 50 bal gerek.');
  $('#finres').innerHTML='<big>'+dec(io,1)+' · '+letterOf(io)+'</big><span>'+L(ok?okT:noT)+'</span>';
}
function gpaCalc(){
  var rows=$$('#gparows .gr'); if(!rows.length) return; var s=0,c=0;
  rows.forEach(function(r){var g=parseFloat($('select',r).value),k=parseFloat($('input',r).value);if(!isNaN(g)&&!isNaN(k)&&k>0){s+=g*k;c+=k}});
  $('#gpares').innerHTML='<big>'+(c?dec(s/c,2):'—')+'</big><span>GPA · '+c+' '+L(T('кредитов','кредит','credits','学分','kredit'))+'</span>';
}

/* Поиск */
function searchIndex(){
  var out=[];
  PAGES.filter(function(p){return p!=='photos'}).forEach(function(p){out.push({t:L(NAV[p]),s:'',h:href(p),k:allv(NAV[p]).toLowerCase(),i:ICON_OF[p]})});
  GL.forEach(function(g){out.push({t:L(g.a)+' — '+L(g.n),s:L(g.d),h:href('study','glossary'),k:(allv(g.a)+' '+allv(g.n)+' '+allv(g.d)).toLowerCase(),i:'book'})});
  FAQ.forEach(function(f){out.push({t:L(f.q),s:'',h:href('ask'),k:(allv(f.q)+' '+allv(f.a)).toLowerCase(),i:'chat'})});
  HELPS.forEach(function(h){out.push({t:L(h.t),s:'',h:href('help'),k:allv(h.t).toLowerCase(),i:'buoy'})});
  BLD.forEach(function(b){out.push({t:L(b.ab)+' — '+L(b.n),s:addr(b.s1,b.num,b.s2),h:href('campus'),k:(allv(b.ab)+' '+allv(b.n)).toLowerCase(),i:'pin'})});
  FAC.forEach(function(f){out.push({t:L(f.n),s:'',h:href('faculties'),k:(allv(f.n)+' '+f.pr.map(allv).join(' ')).toLowerCase(),i:'cap'})});
  return out;
}
function doSearch(q){
  q=q.trim().toLowerCase(); var box=$('#sres'); var idx=searchIndex();
  var res=q? idx.filter(function(x){return x.k.indexOf(q)>-1}).slice(0,30) : idx.filter(function(x){return !x.s}).slice(0,8);
  box.innerHTML=res.length? res.map(function(r){return '<a href="'+r.h+'" data-close="1">'+ic(r.i)+'<span>'+r.t+(r.s?'<small>'+r.s+'</small>':'')+'</span></a>'}).join('') : '<div class="em">'+L(T('Ничего не найдено','Ештеңе табылмады','Nothing found','未找到结果','Hiç zat tapylmady'))+'</div>';
}
function openSearch(){$('#sov').classList.add('open');var i=$('#sin');i.value='';doSearch('');setTimeout(function(){i.focus()},30)}
function closeSearch(){$('#sov').classList.remove('open')}

/* События */
document.addEventListener('click',function(e){
  var t=e.target;
  if(t.closest('[data-stop]')){e.stopPropagation();return}
  var d=t.closest('[data-close]'); if(d){closeSearch()}
  if(t.id==='sov'){closeSearch();return}
  var bb=t.closest('.bld'); if(bb){setBld(bb)}
  var a=t.closest('[data-act]');
  if(!a){ $$('.menu.open').forEach(function(m){m.classList.remove('open')}); return; }
  var act=a.getAttribute('data-act');
  if(act!=='menu') $$('.menu.open').forEach(function(m){m.classList.remove('open')});
  if(act==='lang'){var l=a.getAttribute('data-l');var r=parse();store.set('lang',l);location.hash='#/'+l+'/'+r.p+(r.s?'/'+r.s:'');}
  else if(act==='menu'){var m=$('#m-'+a.getAttribute('data-m'));var was=m.classList.contains('open');$$('.menu.open').forEach(function(x){x.classList.remove('open')});if(!was)m.classList.add('open');}
  else if(act==='theme'){var root=document.documentElement;var cur=root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);var nv=cur?'light':'dark';root.setAttribute('data-theme',nv);store.set('theme',nv);renderHeader(parse().p);}
  else if(act==='drawer'){$('#drawer').classList.toggle('open')}
  else if(act==='search'){openSearch()}
  else if(act==='tab'){var tb=a.getAttribute('data-tab');$$('.tabs button').forEach(function(b){b.classList.toggle('on',b===a)});$$('.panel').forEach(function(p){p.classList.toggle('on',p.getAttribute('data-panel')===tb)});var r2=parse();history.replaceState(null,'','#/'+lang+'/'+r2.p+'/'+tb);$$('[data-bar],.tl').forEach(function(el){animate(el)});}
  else if(act==='ck'){var id=a.getAttribute('data-id');var dn=store.get('fw',[]);var k=dn.indexOf(id);if(k>-1)dn.splice(k,1);else dn.push(id);store.set('fw',dn);a.classList.toggle('done');a.setAttribute('aria-checked',a.classList.contains('done'));paintFW();}
  else if(act==='fwreset'){store.set('fw',[]);$$('.ck').forEach(function(c){c.classList.remove('done')});paintFW();}
  else if(act==='gpaadd'){$('#gparows').insertAdjacentHTML('beforeend',gpaRow('B',5));gpaCalc();}
  else if(act==='gpadel'){var rows=$$('#gparows .gr');if(rows.length>1){a.closest('.gr').remove();gpaCalc();}}
  else if(act==='guess'){var card=a.closest('.sc');var right=card.getAttribute('data-v')===a.getAttribute('data-g');$$('.gb button',card).forEach(function(b){b.classList.remove('right','wrong');if(b.getAttribute('data-g')===card.getAttribute('data-v'))b.classList.add('right')});if(!right)a.classList.add('wrong');$('.vd',card).classList.add('show');}
  else if(act==='cat'){$$('.chip').forEach(function(c){c.classList.toggle('on',c===a)});filterFaq();}
  else if(act==='ask'){ if(CONFIG.FORM_URL){window.open(CONFIG.FORM_URL,'_blank','noopener')} else toast(L(T('Ссылка на форму ещё не добавлена.','Форма сілтемесі әлі қосылмаған.','The form link has not been added yet.','表单链接尚未添加。','Forma salgylanmasy entek goşulmady.'))); }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.getAttribute('data-calc')==='fin') finCalc();
  if(t.getAttribute('data-calc')==='gpa') gpaCalc();
  if(t.id==='sin') doSearch(t.value);
  var f=t.getAttribute('data-filter');
  if(f==='gl'){var q=t.value.toLowerCase();$$('.gli').forEach(function(c){c.style.display=c.getAttribute('data-s').indexOf(q)>-1?'':'none'})}
  if(f==='faq') filterFaq();
});
document.addEventListener('change',function(e){var t=e.target;if(t.getAttribute&&t.getAttribute('data-calc')==='gpa')gpaCalc();});
function filterFaq(){
  var inp=$('[data-filter="faq"]'); var q=(inp?inp.value:'').toLowerCase(); var chip=$('.chip.on'); var c=chip?chip.getAttribute('data-cat'):'all';
  $$('.faqi').forEach(function(el){var ok=(c==='all'||el.getAttribute('data-c')===c)&&el.getAttribute('data-s').indexOf(q)>-1;el.style.display=ok?'':'none'});
}
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();}
  else if(e.key==='Escape'){closeSearch();$('#drawer').classList.remove('open');$$('.menu.open').forEach(function(m){m.classList.remove('open')})}
  else if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('data-act')==='ck'){e.preventDefault();e.target.click();}
  else if(e.key==='Enter'&&e.target.id==='sin'){var f=$('#sres a');if(f)f.click();}
});
document.addEventListener('mouseover',function(e){var b=e.target.closest&&e.target.closest('.bld');if(b){setBld(b)}});
document.addEventListener('focusin',function(e){var b=e.target.closest&&e.target.closest('.bld');if(b){setBld(b)}});
function setBld(b){var i=$('#binfo');if(!i)return;$$('.bld').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel');i.innerHTML=bldInfo(b.getAttribute('data-b'));}
window.addEventListener('scroll',function(){var h=document.documentElement;var s=h.scrollTop/(h.scrollHeight-h.clientHeight||1);$('#progress').style.width=(s*100)+'%'},{passive:true});
window.addEventListener('hashchange',render);

/* старт */
var th=store.get('theme',null); if(th) document.documentElement.setAttribute('data-theme',th);
render();

})();
</script>
